<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Яркий город</title>
<style>
  @font-face { font-family: 'Unbounded'; src: url(fonts/unbounded-cyrillic.woff2) format('woff2');
    font-weight: 200 900; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'Unbounded'; src: url(fonts/unbounded-latin.woff2) format('woff2');
    font-weight: 200 900; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2212; }
  html, body { margin: 0; height: 100%; background: #0e0f12; overflow: hidden; font-family: 'Unbounded', sans-serif; }
  canvas { position: fixed; inset: 0; margin: auto; width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); }
  #ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;
    background: rgba(10,10,14,.55); color: #fff; transition: opacity .4s; }
  #ui.hide { opacity: 0; pointer-events: none; }
  #ui button { font: 600 clamp(16px, 2vw, 22px) 'Unbounded', sans-serif; color: #2a1840; background: #fff;
    border: 0; border-radius: 999px; padding: 16px 34px; cursor: pointer; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  #bar { position: fixed; left: 0; bottom: 0; height: 3px; width: 0; background: linear-gradient(90deg,#ff5d8f,#ffb547,#ffe45c,#5fe0a6,#58c4ff,#a985ff); }
  body.export #ui, body.export #bar { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ui"><button id="play">▶ Смотреть со звуком</button></div>
<div id="bar"></div>
<audio id="music" src="soundtrack.m4a" preload="auto"></audio>
<script>
'use strict';
/* =========================================================================
   «Яркий город» — 20 с. Детерминированный таймлайн: renderAt(t) рисует кадр
   только по времени t (без накопленного состояния), поэтому кадры можно
   рендерить в любом порядке и параллельно.
   ========================================================================= */
const W = 1920, H = 1080, F = 1000, DUR = 20;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const LAY = { sky: mk(), far: mk(), mid: mk(), facade: mk(), fg: mk() };
const TMP = mk(), ACC = mk(), BLUR = mk();
const tctx = TMP.getContext('2d'), actx = ACC.getContext('2d'), bctx = BLUR.getContext('2d');
const mctx = mk().getContext('2d');

/* ---------- утилиты ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const smooth = (e0, e1, x) => { const u = clamp((x - e0) / (e1 - e0), 0, 1); return u * u * (3 - 2 * u); };
const easeIO = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const easeOut3 = u => 1 - Math.pow(1 - clamp(u, 0, 1), 3);
const elastic = x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI / 3)) + 1;
const hr = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function rng(seed) { let a = seed | 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`;
const grey = (l, a = 1) => `hsla(215,7%,${l}%,${a})`;
const TAU = Math.PI * 2;

/* =========================================================================
   КАМЕРА: 2.5D с перспективой. Плоскость глубины z проецируется аффинно:
   s = F/(z - cam.z). Ключи интерполируются сплайном Эрмита с касательными
   Катмулла-Рома, поэтому скорость камеры непрерывна на ключах.
   ========================================================================= */
const CAMK = [ // t, x, y, z, roll
  [0.0, 420, -1250, -1780, 0],
  [1.2, 360, -1220, -1700, -.008],
  [2.0, 220, -1040, -1500, -.012],
  [2.6, 130, -620, -1180, .006],
  [3.1, 120, -300, -950, .01],
  [4.0, 330, -360, -1080, 0],
  [5.25, 440, -380, -960, -.02],
  [6.1, 425, -150, -560, .012],
  [7.0, 400, -140, -500, 0],
  [8.0, 200, -250, -860, 0],
  [8.5, 260, -360, -1000, -.02],
  [9.3, 660, -820, -1080, .035],
  [10.0, 1170, -380, -1000, 0],
  [11.0, 1450, -380, -1100, 0],
  [12.0, 1700, -400, -1150, -.012],
  [13.0, 1300, -420, -1200, .01],
  [14.0, 720, -520, -1350, 0],
  [14.6, 380, -760, -1650, 0],
  [15.3, 250, -860, -1800, 0],
  [16.0, 420, -720, -1700, 0],
  [20.0, 450, -700, -1620, 0],
];
const SHAKES = [ [4.0, 16], [4.075, 7], [4.15, 7], [4.225, 7], [4.3, 7], [4.375, 9], [5.25, 7], [10.0, 12], [15.2, 4], [16.0, 5] ];
function camAt(t) {
  const K = CAMK, n = K.length;
  let v;
  if (t <= K[0][0]) v = K[0].slice(1);
  else if (t >= K[n - 1][0]) v = K[n - 1].slice(1);
  else {
    let i = 0; while (K[i + 1][0] < t) i++;
    const k0 = K[i], k1 = K[i + 1], dt = k1[0] - k0[0], u = (t - k0[0]) / dt;
    const tan = (j, c) => (j === 0 || j === n - 1) ? 0 : (K[j + 1][c] - K[j - 1][c]) / (K[j + 1][0] - K[j - 1][0]);
    const u2 = u * u, u3 = u2 * u;
    const h00 = 2 * u3 - 3 * u2 + 1, h10 = u3 - 2 * u2 + u, h01 = -2 * u3 + 3 * u2, h11 = u3 - u2;
    v = [1, 2, 3, 4].map(c => h00 * k0[c] + h10 * dt * tan(i, c) + h01 * k1[c] + h11 * dt * tan(i + 1, c));
  }
  let amp = 0;
  for (const [ts, a] of SHAKES) if (t >= ts) amp += a * Math.exp(-(t - ts) * 9);
  return { x: v[0], y: v[1], z: v[2], roll: v[3] + amp * .0007 * Math.sin(t * 59),
    sx: amp * (Math.sin(t * 73) + .5 * Math.sin(t * 131)), sy: amp * (Math.cos(t * 67) + .5 * Math.sin(t * 149 + 1)) };
}
function planeM(cam, z) {
  const s = F / (z - cam.z);
  return new DOMMatrix().translate(W / 2 + cam.sx, H / 2 + cam.sy).rotate(cam.roll * 180 / Math.PI).scale(s).translate(-cam.x, -cam.y);
}
function setPlane(c, cam, z) { c.setTransform(planeM(cam, z)); return F / (z - cam.z); }
function proj(cam, x, y, z) {
  const s = F / (z - cam.z), X = (x - cam.x) * s, Y = (y - cam.y) * s, co = Math.cos(cam.roll), si = Math.sin(cam.roll);
  return [W / 2 + cam.sx + X * co - Y * si, H / 2 + cam.sy + X * si + Y * co, s];
}
// Глубина резкости: кружок рассеяния растёт с удалением от плоскости фокуса z=0.
function coc(cam, z) {
  const d = z - cam.z, df = -cam.z;
  const A = lerp(7, 15, smooth(-760, -500, cam.z));
  return clamp(A * Math.abs(d - df) / d, 0, 20);
}

/* =========================================================================
   ГОРОД (генерация с фиксированным seed)
   ========================================================================= */
const PAL = [8, 24, 44, 150, 172, 198, 255, 285, 330];
const R0 = rng(2026);
const pick = (r, a) => a[Math.floor(r() * a.length)];
function genRow(x0, x1, wMin, wMax, hMin, hMax, gap, r) {
  const out = []; let x = x0;
  while (x < x1) {
    const w = lerp(wMin, wMax, r()), h = lerp(hMin, hMax, r());
    out.push({ x, w, h, hue: pick(r, PAL), l: r(), seed: Math.floor(r() * 1e6), type: Math.floor(r() * 4) });
    x += w + gap * r();
  }
  return out;
}
const FAR = genRow(-7200, 8800, 520, 1050, 1400, 2800, 60, R0);
const MID = genRow(-4300, 5800, 320, 620, 900, 1750, 40, R0);
const FAC = genRow(-3300, 4600, 280, 470, 430, 930, 0, R0);
for (const b of FAC) {
  b.cols = Math.max(2, Math.floor((b.w - 60) / 80)); b.rows = Math.max(2, Math.floor((b.h - 210) / 105));
  b.lit = Array.from({ length: b.cols * b.rows }, (_, i) => hr(b.seed + i * 7.3) < .3);
  b.box = Array.from({ length: b.cols * b.rows }, (_, i) => hr(b.seed + i * 3.1) < .45);
}
const CLOUDS = Array.from({ length: 9 }, (_, i) => ({ x: -5200 + i * 1500 + R0() * 600, y: -3700 + R0() * 1200, s: lerp(1.2, 2.2, R0()), v: lerp(14, 30, R0()) }));
const LAMPS = [-1450, -350, 900, 2150, 3350];
const PLANTERS = []; for (let x = -2400; x < 4000; x += 330) PLANTERS.push({ x: x + hr(x) * 60, seed: x });
const BIRDS = Array.from({ length: 6 }, (_, i) => ({ dx: -i * 150 - (i % 2) * 60, dy: (i % 3) * 70 - i * 18, ph: i * 1.7 }));

/* =========================================================================
   ШАРИК: хореография сегментами. y — центр, мир: y вниз, земля y=0.
   ========================================================================= */
const R = 62;
const TITLE = { x: 420, y: -1150, size: 240, track: 14 };
const TOWER = { x: 690, size: 160, word: 'ЯЗЬЛЕН' }; // снизу вверх
let HIT_X = -200, BONK_X = 540, towerLay = null, titleA = null, titleB = null;
let SEG = [];
function buildSeg() {
  SEG = [
    { a: -99, b: 1.0, k: 'hold', x: -60, y: -2300 - R },
    { a: 1.0, b: 3.0, k: 'fall', x0: -60, x1: 0, y0: -2300 },
    { a: 3.0, b: 3.5, k: 'hop', x0: 0, x1: 150, h: 110 },
    { a: 3.5, b: 4.0, k: 'hop', x0: 150, x1: 300, h: 100 },
    { a: 4.0, b: 4.4, k: 'hop', x0: 300, x1: 255, h: 45 },
    { a: 4.4, b: 4.75, k: 'hold', x: 255, y: -R, antic: .22 },
    { a: 4.75, b: 5.25, k: 'bonkUp', x0: 255, x1: BONK_X, h: 240 },
    { a: 5.25, b: 5.75, k: 'bonkDown', x0: BONK_X, x1: 420, h: 240 },
    { a: 5.75, b: 6.05, k: 'hop', x0: 420, x1: 420, h: 30 },
    { a: 6.05, b: 7.0, k: 'hold', x: 420, y: -R },
    { a: 7.0, b: 8.0, k: 'roll', x0: 420, x1: 0 },
    { a: 8.0, b: 8.5, k: 'charge', x: 0 },
    { a: 8.5, b: 10.0, k: 'big', x0: 0, x1: 1300, h: 880 },
    { a: 10.0, b: 10.5, k: 'hop', x0: 1300, x1: 1480, h: 170 },
    { a: 10.5, b: 11.0, k: 'hop', x0: 1480, x1: 1660, h: 160 },
    { a: 11.0, b: 11.5, k: 'hop', x0: 1660, x1: 1820, h: 150 },
    { a: 11.5, b: 12.0, k: 'hop', x0: 1820, x1: 1920, h: 130 },
    { a: 12.0, b: 12.5, k: 'hop', x0: 1920, x1: 1600, h: 150 },
    { a: 12.5, b: 13.0, k: 'hop', x0: 1600, x1: 1280, h: 150 },
    { a: 13.0, b: 13.5, k: 'hop', x0: 1280, x1: 960, h: 150 },
    { a: 13.5, b: 14.0, k: 'hop', x0: 960, x1: 640, h: 150 },
    { a: 14.0, b: 14.5, k: 'hop', x0: 640, x1: 320, h: 140 },
    { a: 14.5, b: 15.2, k: 'launch', x0: 320, x1: HIT_X, h: -TITLE.y - 2 * R + 4 },
    { a: 15.2, b: 16.0, k: 'drop', x0: HIT_X, x1: 420, h: -TITLE.y - 2 * R + 4 },
    { a: 16.0, b: 16.45, k: 'hop', x0: 420, x1: 440, h: 90 },
    { a: 16.45, b: 16.75, k: 'hop', x0: 440, x1: 450, h: 30 },
    { a: 16.75, b: 999, k: 'rest', x: 450 },
  ];
}
const CONTACTS = [
  { t: 3.0, s: .48 }, { t: 3.5, s: .3 }, { t: 4.0, s: .3 }, { t: 4.4, s: .2 },
  { t: 4.75, s: .22, noPre: 1 }, { t: 5.25, s: .42, n: [-1, 0] }, { t: 5.75, s: .3 }, { t: 6.05, s: .12 },
  { t: 8.5, s: .4, noPre: 1 }, { t: 10.0, s: .52 },
  { t: 10.5, s: .3 }, { t: 11.0, s: .3 }, { t: 11.5, s: .3 }, { t: 12.0, s: .3 }, { t: 12.5, s: .3 },
  { t: 13.0, s: .3 }, { t: 13.5, s: .3 }, { t: 14.0, s: .3 }, { t: 14.5, s: .3 },
  { t: 15.2, s: .36, n: [0, 1] }, { t: 16.0, s: .42 }, { t: 16.45, s: .2 }, { t: 16.75, s: .1 },
].map(c => ({ n: [0, -1], ...c }));
const BOUNCE_LIGHT = [10.0, 10.5, 11.0, 11.5, 12.0, 12.5, 13.0, 13.5, 14.0, 14.5];

function segAt(t) { for (const s of SEG) if (t < s.b) return s; return SEG[SEG.length - 1]; }
function ballRaw(t) {
  const s = segAt(t), u = clamp((t - s.a) / (s.b - s.a), 0, 1);
  let x, hgt = 0, extra = 0;
  switch (s.k) {
    case 'hold': x = s.x; if (s.y < -R - 1) return { x, y: s.y, extra: 0 }; if (s.antic) extra = s.antic * smooth(s.b - .3, s.b, t); break;
    case 'fall': x = lerp(s.x0, s.x1, u); hgt = -s.y0 * (1 - u * u); break;
    case 'hop': x = lerp(s.x0, s.x1, u); hgt = 4 * s.h * u * (1 - u); break;
    case 'bonkUp': x = lerp(s.x0, s.x1, u); hgt = s.h * (1 - (1 - u) * (1 - u)); break;
    case 'bonkDown': x = lerp(s.x0, s.x1, easeOut3(u) * .6 + u * .4); hgt = s.h * (1 - u * u); break;
    case 'roll': x = lerp(s.x0, s.x1, easeIO(u)); break;
    case 'charge': x = s.x + (u > .4 ? Math.sin(t * 95) * 2.2 * (u - .4) / .6 : 0); extra = .42 * easeIO(u); break;
    case 'big': { const v = u + .6 * Math.sin(TAU * u) / TAU; x = lerp(s.x0, s.x1, v); hgt = 4 * s.h * v * (1 - v); break; }
    case 'launch': x = lerp(s.x0, s.x1, easeOut3(u) * .5 + u * .5); hgt = s.h * (1 - (1 - u) * (1 - u)); break;
    case 'drop': x = lerp(s.x0, s.x1, u); hgt = s.h * (1 - u) * (1 + .4 * u); break;
    case 'rest': x = s.x; extra = .035 * (1 - Math.cos((t - 16.75) * 3.4)) * smooth(16.75, 17.4, t); break;
  }
  return { x, y: -R - hgt, extra };
}
// Время, когда шарик проходил высоту титра (буквы расступаются)
let TITLE_PASS = 2.27;
// Сглаженная для замедления «внутренняя» скорость времени (speed ramp вокруг вершины прыжка)
function storyTime(t) {
  const t0 = 8.95, t1 = 9.75, a = .6, T = t1 - t0;
  if (t <= t0) return t;
  const e = Math.min(t, t1) - t0;
  const lost = a * (e / 2 - T / (4 * Math.PI) * Math.sin(TAU * e / T));
  return t - lost;
}

/* ---------- деформация шарика (упругие касания) ---------- */
function ballState(t) {
  const b = ballRaw(t), nb = ballRaw(t + .008);
  const vx = (nb.x - b.x) / .008, vy = (nb.y - b.y) / .008;
  let dg = b.extra, dw = 0, offx = 0, offy = b.extra * R;
  for (const c of CONTACTS) {
    const dt = t - c.t; if (dt < -.12 || dt > 1.2) continue;
    let d;
    if (dt < 0) { if (c.noPre) continue; d = c.s * Math.exp(-((dt / .03) ** 2)); }
    else d = c.s * Math.exp(-7 * dt) * Math.cos(22 * dt);
    if (c.n[0]) dw += d; else dg += (c.n[1] > 0 ? d : d);
    if (d > 0 && dt < .08) { offx -= c.n[0] * R * d; offy -= c.n[1] * R * d; }
  }
  return { x: b.x + offx, y: b.y + offy, rx: b.x, ry: b.y, vx, vy, dg: clamp(dg, -.3, .5), dw: clamp(dw, -.3, .5), spin: b.x / R };
}
function faceMode(t) {
  if (t < 3.0) return 'wow';
  if (t < 4.0) return 'normal';
  if (t < 4.75) return 'wow';
  if (t < 5.25) return 'focus';
  if (t < 5.6) return 'ouch';
  if (t < 6.5) return 'sad';
  if (t < 6.85) return 'wow';
  if (t < 8.5) return 'focus';
  if (t < 10.0) return 'wow';
  return 'happy';
}
function ballGlow(t) { return .35 + .5 * smooth(6.5, 7.0, t) + .4 * Math.exp(-Math.max(0, t - 8.5) * 4) * (t > 8.5 ? 1 : 0) - .3 * smooth(10.0, 11.5, t); }

/* =========================================================================
   ЦВЕТ: волна-сфера от приземления (1300,0,0) + короткие вспышки
   на ранних касаниях, которые город «впитывает».
   ========================================================================= */
const WAVE = { t: 10.0, x: 1300, y: 0, z: 0, v: 1500 };
const FLASHES = [[3.0, 0, 0, 230], [3.5, 150, 0, 150], [4.0, 300, 0, 150], [5.25, BONK_X + R, -280, 110], [5.75, 420, 0, 150]];
function colorCircles(t, z) {
  const out = [];
  for (const [ft, fx, fy, fr] of FLASHES) {
    const d = t - ft; if (d < 0 || d > .75) continue;
    const r = fr * Math.sin(Math.PI * d / .75), rr = r * r - z * z;
    if (rr > 0) out.push([fx, fy, Math.sqrt(rr)]);
  }
  const R2 = (WAVE.v * (t - WAVE.t)) ** 2 - (z - WAVE.z) ** 2;
  if (t > WAVE.t && R2 > 0) out.push([WAVE.x, WAVE.y, Math.sqrt(R2), 'wave']);
  return out;
}
function covered(circles, cam, z) {
  // покрывает ли круг весь видимый кадр на этой плоскости
  const d = z - cam.z, half = Math.hypot(W, H) / 2 * d / F + 60;
  return circles.some(([x, y, r]) => Math.hypot(x - cam.x, y - cam.y) + half < r);
}
function reachTime(x, y, z) { return WAVE.t + Math.hypot(x - WAVE.x, y - WAVE.y, z - WAVE.z) / WAVE.v; }

/* =========================================================================
   ОТРИСОВКА СЛОЁВ
   ========================================================================= */
function cloudShape(c, x, y, s) {
  c.beginPath();
  [[0, 0, 160], [170, -60, 140], [330, 10, 150], [160, 40, 140], [-150, 40, 110], [470, 50, 100]].forEach(([dx, dy, r]) => {
    c.moveTo(x + dx * s + r * s, y + dy * s); c.arc(x + dx * s, y + dy * s, r * s, 0, TAU);
  });
  c.fill();
}
function skyGrad(c, col, t) {
  const g = c.createLinearGradient(0, 0, 0, H);
  if (!col) { g.addColorStop(0, '#565b62'); g.addColorStop(.55, '#80858c'); g.addColorStop(1, '#a3a7ad'); }
  else {
    const f = smooth(15.2, 19, t);
    g.addColorStop(0, f ? mixc([66, 150, 255], [92, 84, 220], f) : 'rgb(66,150,255)');
    g.addColorStop(.55, mixc([150, 210, 255], [255, 156, 196], f));
    g.addColorStop(1, mixc([255, 236, 200], [255, 206, 140], f));
  }
  return g;
}
function mixc(a, b, f) { return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * f)).join(',')})`; }

function drawSky(c, cam, t) {
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, W, H);
  c.fillStyle = skyGrad(c, false, t); c.fillRect(0, 0, W, H);
  const circ = colorCircles(t, 1800);
  if (circ.length) {
    const [p0, p1] = proj(cam, WAVE.x, 0, 1800);
    const r = circ[circ.length - 1][2] * F / (1800 - cam.z);
    if (circ[circ.length - 1][3]) {
      c.save(); c.beginPath(); c.arc(p0, p1, r, 0, TAU); c.clip();
      c.fillStyle = skyGrad(c, true, t); c.fillRect(0, 0, W, H);
      // мягкое солнце
      const sg = c.createRadialGradient(W * .82, H * .1, 10, W * .82, H * .1, 900);
      const k = .55 + .35 * smooth(15, 19, t);
      sg.addColorStop(0, `rgba(255,246,214,${k})`); sg.addColorStop(.25, `rgba(255,220,150,${k * .5})`); sg.addColorStop(1, 'rgba(255,220,150,0)');
      c.fillStyle = sg; c.fillRect(0, 0, W, H);
      c.restore();
    }
  }
  // облака на плоскости 3500

    c.globalAlpha = .55; c.beginPath(); c.ellipse(cl.x + tt * cl.v + 160 * cl.s, cl.y + 120 * cl.s, 420 * cl.s, 60 * cl.s, 0, 0, TAU); c.fill();
    c.globalAlpha = 1;
  }
}

function drawFar(c, cam, t, col) {
  for (const b of FAR) {
    c.fillStyle = col ? hsl(b.hue, 38, 80 + b.l * 6) : grey(68 + b.l * 8);
    c.fillRect(b.x, -b.h, b.w, b.h);

    if (b.type === 1) { c.beginPath(); c.moveTo(b.x, -b.h); c.lineTo(b.x + b.w / 2, -b.h - b.w * .3); c.lineTo(b.x + b.w, -b.h); c.fill(); }
    c.fillStyle = col ? hsl(b.hue, 30, 74 + b.l * 6) : grey(63 + b.l * 8);

}

function drawMid(c, cam, t, col) {
  const tt = storyTime(t);
  for (const b of MID) {
    const bounce = 1 + .035 * cityBounce(t, b.x + b.w / 2, .7);
    c.save(); c.translate(b.x + b.w / 2, 0); c.scale(1 / Math.sqrt(bounce), bounce); c.translate(-(b.x + b.w / 2), 0);
    c.fillStyle = col ? hsl(b.hue, 45, 70 + b.l * 8) : grey(54 + b.l * 10);

    c.fillRect(b.x - 10, -b.h, b.w + 20, 26);
    if (b.type === 2) c.fillRect(b.x + b.w * .2, -b.h - 120, b.w * .6, 120);
    for (let y = -b.h + 90; y < -60; y += 95) for (let x = b.x + 40; x < b.x + b.w - 50; x += 70) {
      const lit = col && hr(x * .37 + y * .11 + b.seed) < .35;

  }

    const k = t - 16.2;
    c.strokeStyle = col ? '#3b2d63' : '#333'; c.lineWidth = 9; c.lineCap = 'round'; c.lineJoin = 'round';
    for (const bd of BIRDS) {
      const x = -1200 + k * 520 + bd.dx, y = -1700 + bd.dy - k * 60, f = Math.sin(t * 10 + bd.ph) * 30;
      c.beginPath(); c.moveTo(x - 48, y - f); c.quadraticCurveTo(x - 18, y - 22, x, y); c.quadraticCurveTo(x + 18, y - 22, x + 48, y - f); c.stroke();
    }

}

function cityBounce(t, x, amp) {
  let v = 0;
  const d = t - 16.0 - Math.abs(x - 420) / 2600;
  if (d > 0) v += amp * Math.exp(-4.5 * d) * Math.sin(15 * d);
  return v;
}
function popOf(t, b) {
  let v = 0;
  for (const tb of BOUNCE_LIGHT) {
    const bx = ballRaw(tb).x;
    if (bx >= b.x - 20 && bx < b.x + b.w + 20) { const d = t - tb; if (d > 0) v += Math.exp(-6 * d) * Math.sin(17 * d); }
  }
  return v;
}
function lightTime(b) {
  let lt = 99;
  for (const tb of BOUNCE_LIGHT) { const bx = ballRaw(tb).x; if (bx >= b.x - 20 && bx < b.x + b.w + 20) lt = Math.min(lt, tb); }
  return lt;
}

function drawFacade(c, cam, t, col) {
  for (const b of FAC) {
    const cxb = b.x + b.w / 2;
    const k = 1 + .07 * popOf(t, b) + .05 * cityBounce(t, cxb, 1);
    c.save(); c.translate(cxb, 0); c.scale(1 / Math.sqrt(k), k); c.translate(-cxb, 0);
    const L = b.l;
    const body = col ? hsl(b.hue, 62, 64 + L * 10) : grey(36 + L * 18);
    const dark = col ? hsl(b.hue, 50, 48 + L * 8) : grey(27 + L * 14);

    // крыша
    c.fillStyle = dark;
    if (b.type === 1) { c.beginPath(); c.moveTo(b.x - 14, -b.h); c.lineTo(cxb, -b.h - b.w * .32); c.lineTo(b.x + b.w + 14, -b.h); c.fill(); }
    if (b.type === 2) { c.fillRect(b.x + b.w * .15, -b.h - 60, b.w * .7, 60); c.fillRect(b.x + b.w * .3, -b.h - 110, b.w * .4, 50); }

    // окна

      c.fillStyle = glass; c.fillRect(x, y, ww, wh);

function drawFg(c, cam, t, col) {
  for (const x of LAMPS) {

    c.strokeStyle = c.fillStyle; c.lineWidth = 16; c.beginPath(); c.moveTo(x, -740); c.quadraticCurveTo(x + 10, -820, x + 110, -800); c.stroke();
    c.fillStyle = col ? '#24585c' : grey(17); c.beginPath(); c.moveTo(x + 70, -800); c.lineTo(x + 150, -800); c.lineTo(x + 135, -760); c.lineTo(x + 85, -760); c.fill();

/* ---------- дождь (аналитический, мир) ---------- */
const RAIN = Array.from({ length: 900 }, (_, i) => ({ x: hr(i * 1.31) * 9000 - 3600, y: hr(i * 2.77) * 3200, v: lerp(1700, 2300, hr(i * 5.1)), l: lerp(50, 90, hr(i * 7.9)), h: PAL[i % PAL.length] }));
function drawRain(c, t, z, every, lw, col) {
  const a = 1 - smooth(10.2, 11.6, t);
  if (a <= 0) return;
  const tt = storyTime(t);
  c.lineWidth = lw; c.lineCap = 'round';
  const colorNow = col;
  if (!colorNow) { c.strokeStyle = `rgba(220,226,236,${.45 * a})`; c.beginPath(); }
  for (let i = 0; i < RAIN.length; i += (every > 400 ? 2 : 1)) {
    const d = RAIN[i];
    const y = ((d.y + tt * d.v) % 3200) - 2900, x = d.x - y * .12;
    if (y > 20) continue;
    if (colorNow) { c.strokeStyle = hsl(d.h, 90, 70, .7 * a); c.beginPath(); c.moveTo(x, y); c.lineTo(x - d.l * .12, y + d.l); c.stroke(); }
    else { c.moveTo(x, y); c.lineTo(x - d.l * .12, y + d.l); }
  }
  if (!colorNow) c.stroke();
}

/* ---------- земля (горизонтальная плоскость, проекция по точкам) ---------- */
function gpt(cam, x, z) { return proj(cam, x, 0, z); }
function quad(c, cam, x0, x1, z0, z1) {
  const a = gpt(cam, x0, z0), b = gpt(cam, x1, z0), d = gpt(cam, x1, z1), e = gpt(cam, x0, z1);
  c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.lineTo(d[0], d[1]); c.lineTo(e[0], e[1]); c.closePath();
}
function groundEllipse(c, cam, x, z, rx, rz, n = 40) {
  c.beginPath();
  for (let i = 0; i <= n; i++) { const a = i / n * TAU, p = gpt(cam, x + Math.cos(a) * rx, z + Math.sin(a) * rz); i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); }
  c.closePath();
}
function drawGround(c, cam, t, col) {
  c.setTransform(1, 0, 0, 1, 0, 0);
  const zn = Math.max(-1600, cam.z + 60), XL = cam.x - 9000, XR = cam.x + 9000;
  // дорога
  quad(c, cam, XL, XR, zn, 112); c.fillStyle = col ? '#6d6478' : grey(33); c.fill();
  // разметка
  c.fillStyle = col ? '#ffd84d' : grey(50);
  const x0 = Math.floor((cam.x - 4200) / 280) * 280;
  for (let x = x0; x < cam.x + 4200; x += 280) if (zn < -300) { quad(c, cam, x, x + 140, -330, -300); c.fill(); }
  // бордюр и тротуар
  quad(c, cam, XL, XR, 112, 126); c.fillStyle = col ? '#fff4e2' : grey(55); c.fill();
  quad(c, cam, XL, XR, 126, 250); c.fillStyle = col ? '#f2c9a5' : grey(44); c.fill();
  c.strokeStyle = col ? 'rgba(170,110,80,.45)' : grey(36, .8); c.lineWidth = 1.5;
  c.beginPath();
  for (let x = Math.floor((cam.x - 4200) / 120) * 120; x < cam.x + 4200; x += 120) { const a = gpt(cam, x, 126), b = gpt(cam, x, 250); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); }
  const m0 = gpt(cam, XL, 188), m1 = gpt(cam, XR, 188); c.moveTo(m0[0], m0[1]); c.lineTo(m1[0], m1[1]);
  c.stroke();
  // лужи
  for (const [px, pz, rx, rz] of [[0, 10, 150, 70], [980, -140, 120, 55], [1750, 40, 140, 60], [-700, -60, 130, 60]]) {
    groundEllipse(c, cam, px, pz, rx, rz);
    c.fillStyle = col ? 'rgba(140,200,255,.55)' : grey(26, .9); c.fill();
    if (!col && t < 10.5) { // круги от капель
      c.strokeStyle = grey(55, .6); c.lineWidth = 1.5;
      for (let i = 0; i < 3; i++) {
        const ph = ((storyTime(t) * .9 + i / 3 + hr(px + i)) % 1), cx = px + (hr(px * 3 + i) - .5) * rx, cz = pz + (hr(px * 5 + i) - .5) * rz * .8;
        groundEllipse(c, cam, cx, cz, 8 + ph * 40, 4 + ph * 18, 20); c.globalAlpha = 1 - ph; c.stroke(); c.globalAlpha = 1;
      }
    }
  }
}

/* ---------- клумбы на тротуаре (плоскость z=200) ---------- */
function drawPlanters(c, cam, t, col) {
  setPlane(c, cam, 200);
  for (const p of PLANTERS) {
    c.fillStyle = col ? '#b5653d' : grey(30); c.fillRect(p.x - 60, -54, 120, 54);
    c.fillStyle = col ? '#d27c50' : grey(38); c.fillRect(p.x - 66, -60, 132, 12);
    if (!col) { c.strokeStyle = grey(40); c.lineWidth = 4; c.beginPath(); c.moveTo(p.x - 20, -60); c.lineTo(p.x - 30, -100); c.moveTo(p.x + 15, -60); c.lineTo(p.x + 26, -92); c.stroke(); continue; }
    const k = elastic(clamp((t - reachTime(p.x, -60, 200) - .1) / .9, 0, 1));
    if (k <= 0) continue;
    for (let f = 0; f < 5; f++) {
      const fx = p.x - 44 + f * 22, hgt = (55 + hr(p.seed + f) * 45) * k, hue = PAL[Math.floor(hr(p.seed * 3 + f) * PAL.length)];
      c.strokeStyle = '#3b8a3f'; c.lineWidth = 5; c.beginPath(); c.moveTo(fx, -58); c.lineTo(fx, -58 - hgt); c.stroke();
      c.fillStyle = hsl(hue, 88, 64);
      for (let q = 0; q < 5; q++) { const a = q / 5 * TAU; c.beginPath(); c.arc(fx + Math.cos(a) * 9 * k, -58 - hgt + Math.sin(a) * 9 * k, 7 * k, 0, TAU); c.fill(); }
      c.fillStyle = '#ffe14d'; c.beginPath(); c.arc(fx, -58 - hgt, 5 * k, 0, TAU); c.fill();
    }
  }
}

/* =========================================================================
   ТИПОГРАФИКА
   ========================================================================= */
const fontStr = (w, s) => `${Math.round(w / 25) * 25} ${s}px Unbounded`;
const mcache = new Map();
function mw(ch, w, s) { const k = ch + w + '|' + s; if (!mcache.has(k)) { mctx.font = fontStr(w, s); mcache.set(k, mctx.measureText(ch).width); } return mcache.get(k); }
function layout(str, w, s, cx, track) {
  const ws = [...str].map(ch => mw(ch, w, s)), tot = ws.reduce((a, b) => a + b, 0) + track * (ws.length - 1);
  let x = cx - tot / 2;
  return [...str].map((ch, i) => { const o = { ch, x: x + ws[i] / 2, w: ws[i] }; x += ws[i] + track; return o; });
}
function glyph(c, ch, x, y, s, w, face, side, depth, ang = 0, sx = 1, sy = 1) {
  c.save(); c.translate(x, y); if (ang) c.rotate(ang); c.scale(sx, sy);
  c.font = fontStr(w, s); c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  if (depth > 0) { c.fillStyle = side; const n = Math.ceil(depth / 2.2); for (let i = n; i >= 1; i--) c.fillText(ch, i * 1.6 * depth / n * .7, i * 1.2 * depth / n * .7 + 0); }
  c.fillStyle = face; c.fillText(ch, 0, 0);
  c.restore();
}

/* ---------- башня «НЕЛЬЗЯ» ---------- */
function towerInit() {
  mctx.font = fontStr(900, TOWER.size);
  const capH = mctx.measureText('Н').actualBoundingBoxAscent, gap = 8;
  towerLay = [...TOWER.word].map((ch, k) => ({ ch, k, base: -k * (capH + gap), capH, w: mw(ch, 900, TOWER.size) }));
  const hitL = towerLay[2];
  BONK_X = TOWER.x - hitL.w / 2 - R + 6;
  FLASHES[3][1] = BONK_X + R;
}
const POP = [ // параметры разлёта букв: vx, vy, vz, spin
  [-560, -980, -260, -3], [420, -1150, -820, 4], [-300, -1300, -1250, -5], [650, -1050, -380, 6], [-720, -1250, -980, -4], [260, -1450, -640, 5],
];
function towerLand(k) { return 4.0 + .075 * k; }
function towerPop(k) { return 10.52 + (5 - k) * .07; }
function drawTower(c, cam, t, col, popped) {
  if (t < 3.7) return;
  for (const L of towerLay) {
    const tl = towerLand(L.k), tp = towerPop(L.k);
    if (t < tl - .3) continue;
    const isPopped = t >= tp;
    if (isPopped !== popped) continue;
    let x = TOWER.x, y = L.base, z = 0, ang = 0, sx = 1, sy = 1;
    if (t < tl) { const u = (t - (tl - .3)) / .3; y = L.base - 1300 * (1 - u * u); sy = 1.06; sx = .97; }
    else if (!isPopped) {
      const d = t - tl; sy = 1 - .1 * Math.exp(-14 * d) * Math.cos(22 * d); sx = 1 / Math.sqrt(sy);
      // удары сверху сжимают нижние буквы
      for (let j = L.k + 1; j < 6; j++) { const dj = t - towerLand(j); if (dj > 0) sy -= .04 * Math.exp(-16 * dj) * Math.cos(24 * dj); }
      if (L.k === 2 && t > 5.25) x += 12 * Math.exp(-8 * (t - 5.25)) * Math.sin(30 * (t - 5.25));
      if (t > 5.25) ang = .01 * Math.exp(-6 * (t - 5.25)) * Math.sin(26 * (t - 5.25)) * (L.k / 5);
      if (col) { const pre = t - (tp - .25); if (pre > 0) { const w = Math.sin(pre * 40) * .06 * pre / .25; sx += w; sy -= w; } }
    } else {
      const d = t - tp, [vx, vy, vz, sp] = POP[L.k];
      x += vx * d; y = L.base + vy * d + .5 * 2600 * d * d; z = vz * d; ang = sp * d;
      const jelly = .18 * Math.exp(-5 * d) * Math.sin(20 * d); sx = 1 + jelly; sy = 1 - jelly;
      if (z - cam.z < 60 || d > 1.3) continue;
    }
    const face = col ? hsl(PAL[(L.k * 2 + 1) % PAL.length], 85, 60) : null;
    if (isPopped) { spriteGlyph(c, cam, L, x, y, z, ang, sx, sy, face); continue; }
    setPlane(c, cam, 0);
    if (col) glyph(c, L.ch, x, y, TOWER.size, 900, face, hsl(PAL[(L.k * 2 + 1) % PAL.length], 70, 36), 18, ang, sx, sy);
    else {
      const g = c.createLinearGradient(0, y - L.capH, 0, y);
      g.addColorStop(0, grey(62)); g.addColorStop(1, grey(40));
      glyph(c, L.ch, x, y, TOWER.size, 900, g, grey(22), 18, ang, sx, sy);
    }
    c.filter = 'none';
  }
}

// Разлетающаяся буква: рисуется в маленький спрайт и размывается по глубине только там.
const SPR = document.createElement('canvas'), sprc = SPR.getContext('2d');
function spriteGlyph(c, cam, L, x, y, z, ang, sx, sy, face) {
  const [X, Y, s] = proj(cam, x, y - L.capH / 2, z), b = coc(cam, z);
  const size = Math.ceil(TOWER.size * 1.9 * s + 6 * b + 24);
  const side = hsl(PAL[(L.k * 2 + 1) % PAL.length], 70, 36);
  if (size > 1400) { setPlane(c, cam, z); glyph(c, L.ch, x, y, TOWER.size, 900, face, side, 18, ang, sx, sy); return; }
  if (SPR.width < size) { SPR.width = SPR.height = size; }
  sprc.setTransform(1, 0, 0, 1, 0, 0); sprc.clearRect(0, 0, size, size);

const TITLE_GREY = 'СЕРЫЙ ГОРОД', TITLE_COL = 'ЯРКИЙ ГОРОД';

function drawParticles(c, cam, t) {

function circlesPath(c, circ) { c.beginPath(); for (const [x, y, r] of circ) { c.moveTo(x + r, y); c.arc(x, y, r, 0, TAU); } }

  const d = t - WAVE.t; if (d <= 0 || d > 2.6) return;
  const R2 = (WAVE.v * d) ** 2 - z * z; if (R2 <= 0) return;
  const r = Math.sqrt(R2), a = 1 - d / 2.6;
  c.lineWidth = 46; c.strokeStyle = `rgba(255,255,255,${.35 * a})`; c.beginPath(); c.arc(WAVE.x, WAVE.y, r, 0, TAU); c.stroke();

function renderColorable(c, cam, t, z, fn) {

  const circ = colorCircles(t, z), full = circ.length && covered(circ, cam, z);
  setPlane(c, cam, z);
  if (!full) fn(c, cam, t, false);
  if (circ.length) {
    c.save(); setPlane(c, cam, z);
    if (!full) { circlesPath(c, circ); c.clip(); }

    c.restore();

// Земля, клумбы, башня, дождь, титр, частицы, шарик — перерисовываются на каждом субкадре.
function drawDynamic(c, cam, t) {
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, W, H);
  // земля: серая + цветная внутри эллипса волны на плоскости земли

  if (circ.length) {
    c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.beginPath();
    for (const [x, , r, wv] of circ) {

      for (let i = 0; i <= 48; i++) { const a = i / 48 * TAU, p = gpt(cam, x + Math.cos(a) * r, clamp(Math.sin(a) * r, cam.z + 61, 4000)); i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); }

  drawShadow(c, cam, t);

  // башня
  const tc = colorCircles(t, 0), tfull = tc.length && covered(tc, cam, 0);

const STATIC = [ // слой, глубина, функция

const SHUTTER = 1 / 120; // 180° при 60 fps

  for (const z of [-450, 0, 250]) {
    if (z - a.z < 80 || z - b.z < 80) continue;
    const p = proj(a, a.x, a.y, z), q = proj(b, a.x, a.y, z); m = Math.max(m, Math.hypot(p[0] - q[0], p[1] - q[1]));
  }
  const ba = ballRaw(t - SHUTTER / 2), bb = ballRaw(t + SHUTTER / 2);
  const p = proj(a, ba.x, ba.y, 0), q = proj(b, bb.x, bb.y, 0);
  m = Math.max(m, Math.hypot(p[0] - q[0], p[1] - q[1]));
  for (const k of [0, 1, 2, 3, 4, 5]) if (t > towerPop(k) && t < towerPop(k) + .9) m = Math.max(m, 18);
  return m;
}

function composite(src, blur, alpha = 1) {
  ctx.globalAlpha = alpha;
  if (blur > .6) ctx.filter = `blur(${blur.toFixed(2)}px)`;
  ctx.drawImage(src, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1;
}

function renderAt(t, quality = 1) {
  const cam = camAt(t);
  const n = quality > 0 ? clamp(Math.ceil(screenSpeed(t) / 2.5), 1, 12) : 1;
  const times = n === 1 ? [t] : Array.from({ length: n }, (_, i) => t - SHUTTER / 2 + SHUTTER * (i + .5) / n);
  const cams = times.map(camAt);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  // статичные слои: один рендер + смещение по камере на каждом субкадре
  const all = [...STATIC, ['fg', -450, (c, cm, tt) => renderColorable(c, cm, tt, -450, drawFg)]];
  const order = ['sky', 'far', 'mid', 'facade', 'DYN', 'fg'];
  for (const name of order) {
    if (name === 'DYN') {
      if (n === 1) { drawDynamic(tctx, cam, t); composite(TMP, 0); }
      else {
        actx.setTransform(1, 0, 0, 1, 0, 0); actx.clearRect(0, 0, W, H); actx.globalCompositeOperation = 'lighter'; actx.globalAlpha = 1 / n;
        for (let i = 0; i < n; i++) { drawDynamic(tctx, cams[i], times[i]); actx.drawImage(TMP, 0, 0); }
        actx.globalCompositeOperation = 'source-over'; actx.globalAlpha = 1;
        composite(ACC, 0);
      }
      continue;
    }
    const [, z, fn] = all.find(l => l[0] === name);
    const d = z - cam.z;
    if (d < 70) continue;
    const fade = name === 'fg' ? smooth(90, 380, d) : 1;
    const lc = LAY[name], lctx = lc.getContext('2d');
    fn(lctx, cam, t);
    const blur = coc(cam, z) * (quality > 0 ? 1 : 0);
    if (n === 1) { composite(lc, blur, fade); continue; }
    const M0inv = planeM(cam, z).inverse();
    actx.setTransform(1, 0, 0, 1, 0, 0); actx.clearRect(0, 0, W, H); actx.globalCompositeOperation = 'lighter'; actx.globalAlpha = 1 / n;
    for (let i = 0; i < n; i++) {
      if (z - cams[i].z < 70) continue;
      actx.setTransform(planeM(cams[i], z).multiply(M0inv)); actx.drawImage(lc, 0, 0);
    }
    actx.setTransform(1, 0, 0, 1, 0, 0); actx.globalCompositeOperation = 'source-over'; actx.globalAlpha = 1;
    composite(ACC, blur, fade);
  }
  // атмосфера: виньетка, цветокоррекция по сюжету
  const greyK = 1 - smooth(10.0, 12.5, t);
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(16,12,28,${.28 + .25 * greyK})`);
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (t > 9.97 && t < 10.25) { ctx.fillStyle = `rgba(255,250,235,${.28 * (1 - (t - 9.97) / .28)})`; ctx.fillRect(0, 0, W, H); }
  const fadeIn = 1 - smooth(0, .7, t);
  if (fadeIn > 0) { ctx.fillStyle = `rgba(0,0,0,${fadeIn})`; ctx.fillRect(0, 0, W, H); }
  return n;
}

/* =========================================================================
   ИНИЦИАЛИЗАЦИЯ И ПРОСМОТР
   ========================================================================= */
window.ready = (async () => {
  await Promise.all([document.fonts.load('200 100px Unbounded', 'СЕРЫЙГОДЯКИНЛЬЗ'), document.fonts.load('900 100px Unbounded', 'ЯРКИЙГОДНЕЛЬЗ')]);
  await document.fonts.ready;
  titleInit(); towerInit(); buildSeg(); eventsInit();
  // момент пересечения шариком строки титра
  for (let t = 1; t < 3; t += .005) if (ballRaw(t).y > TITLE.y - 120) { TITLE_PASS = t; break; }
  return true;
})();
window.renderAt = renderAt;

const isExport = new URLSearchParams(location.search).has('export');
if (isExport) document.body.classList.add('export');
else {
  const music = document.getElementById('music'), ui = document.getElementById('ui'), bar = document.getElementById('bar');
  let playing = false, t0 = 0, useAudio = false;
  const now = () => useAudio ? music.currentTime : (performance.now() - t0) / 1000;
  function loop() {
    const t = Math.min(now(), DUR);
    renderAt(t, 0); bar.style.width = (t / DUR * 100) + '%';
    if (t < DUR && playing) requestAnimationFrame(loop);
    else { playing = false; ui.classList.remove('hide'); document.getElementById('play').textContent = '↻ Ещё раз'; }
  }
  async function start() {
    await window.ready; ui.classList.add('hide'); playing = true;
    try { music.currentTime = 0; await music.play(); useAudio = true; } catch (e) { useAudio = false; t0 = performance.now(); }
    requestAnimationFrame(loop);
  }
  ui.addEventListener('click', start);
  window.ready.then(() => renderAt(0.9, 0));
}
</script>
